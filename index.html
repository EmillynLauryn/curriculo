<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>curriculo</title>
</head>
<body>
<div class="container">
    <header>
        <img id="foto-perfil" class="foto-perfil" src="image/imagem.jpeg" alt="Foto de perfil">
    
        <h1 id="nome"></h1>
        <p class="subtitle" id="titulo"></p>
        <div class="contact-info" id="contato"></div>
    </header>

    <main>
      <section>
        <h2>Resumo Profissional</h2>
        <p id="resumo-desc"></p>
        <p class="objetivo"><strong>Objetivo:</strong> <span id="resumo-objetivo"></span></p>
      </section>

      <section>
        <h2>Experiência Profissional</h2>
        <div id="lista-experiencias"></div>
      </section>

      <section>
        <h2>Projetos</h2>
        <div id="lista-projetos"></div>
      </section>

      <section>
        <h2>Formação Acadêmica & Cursos</h2>
        <div id="lista-formacao"></div>
      </section>

      <div class="grid-2">
        <section>
          <h2>Ferramentas & Metodologias</h2>
          <div class="tags" id="lista-ferramentas"></div>
        </section>

        <section>
          <h2>Certificações & Idiomas</h2>
          <ul id="lista-certificacoes"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
